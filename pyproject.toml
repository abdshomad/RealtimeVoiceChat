[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-chat"
version = "0.1.0"
description = "Real-time AI voice chat with natural conversation capabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KoljaB", email = "github@example.com"}
]
keywords = ["ai", "voice", "chat", "realtime", "speech", "tts", "stt", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.10"
dependencies = [
    # Speech to text and text to speech
    "realtimestt==0.3.104",
    "realtimetts[kokoro,coqui,orpheus]==0.5.5",
    
    # Web server dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Configuration
    "python-dotenv>=1.0.0",
    
    # LLM providers
    "ollama>=0.1.0",
    "openai>=1.0.0",
    
    # MMS-TTS dependencies
    "transformers>=4.33.0",
    "torch>=2.1.0",
    "scipy>=1.11.0",
    "accelerate>=0.24.0",
    
    # Additional audio processing
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    
    # WebSocket and async support
    "websockets>=11.0.0",
    "starlette>=0.27.0",
    
    # Utilities
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
docker = [
    "gunicorn>=21.0.0",
]
gpu = [
    "torch>=2.1.0+cu121",
    "torchaudio>=2.1.0+cu121",
    "deepspeed>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/KoljaB/RealtimeVoiceChat"
Repository = "https://github.com/KoljaB/RealtimeVoiceChat"
Documentation = "https://github.com/KoljaB/RealtimeVoiceChat#readme"
Issues = "https://github.com/KoljaB/RealtimeVoiceChat/issues"

[project.scripts]
realtime-voice-chat = "code.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.setuptools.package-data]
"code" = ["*.txt", "*.wav", "*.json"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["code"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "realtimestt.*",
    "realtimetts.*",
    "ollama.*",
    "openai.*",
    "transformers.*",
    "torch.*",
    "torchaudio.*",
    "scipy.*",
    "accelerate.*",
    "soundfile.*",
    "websockets.*",
    "starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["code"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 