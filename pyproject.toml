[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "realtime-voice-chat"
version = "1.0.0"
description = "Real-Time AI Voice Chat - Have natural spoken conversations with AI using voice input and receiving spoken responses in near real-time"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Abd Shomad", email = "abd.shomad@gmail.com"},
    {name = "KoljaB", email = "kolja@example.com"}
]
maintainers = [
    {name = "Abd Shomad", email = "abd.shomad@gmail.com"}
]
keywords = [
    "ai", "voice", "chat", "speech-to-text", "text-to-speech", 
    "real-time", "llm", "conversation", "audio", "websockets"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core AI/ML Libraries
    "realtimestt @ git+https://github.com/koljaB/RealtimeSTT.git",
    "realtimetts @ git+https://github.com/koljaB/RealtimeTTS.git",
    "gtts>=2.5.0",
    "parler-tts>=0.2.0",
    "edge-tts>=7.0.0",
    "transformers",
    # Web Server Dependencies
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=11.0",
    # Configuration and Environment
    "python-dotenv>=0.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # LLM Providers
    "ollama>=0.1.0",
    "openai>=1.0.0",
    # Audio Processing
    "numpy>=1.24.0",
    "scipy>=1.9.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    # NLP and TTS Dependencies
    "spacy>=3.0.0",
    "nltk>=3.8.0",
    # Utilities
    "requests>=2.28.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.6",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "torchvision>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docker = [
    "docker>=6.0.0",
]
gpu = [
    "accelerate>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/abdshomad/RealtimeVoiceChat"
Documentation = "https://github.com/abdshomad/RealtimeVoiceChat#readme"
Repository = "https://github.com/abdshomad/RealtimeVoiceChat.git"
Issues = "https://github.com/abdshomad/RealtimeVoiceChat/issues"
Changelog = "https://github.com/abdshomad/RealtimeVoiceChat/blob/main/CHANGELOG.md"

[project.scripts]
realtime-voice-chat = "code.server:app"

[tool.hatch.build.targets.wheel]
packages = ["code"]

[tool.hatch.build.targets.sdist]
include = [
    "/code",
    "/code/static",
    "/docs",
    "README.md",
    "LICENSE",
    "requirements.txt",
    "docker-compose.yml",
    "Dockerfile",
    "run_server.sh",
    "install.bat",
    "start_venv.bat",
    "entrypoint.sh",
    ".cursorrules",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["code"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "realtimestt.*",
    "realtimetts.*",
    "transformers.*",
    "torch.*",
    "torchaudio.*",
    "torchvision.*",
    "librosa.*",
    "soundfile.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["code"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# UV specific configuration
[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]



# Docker configuration hints
[tool.docker]
# This section provides hints for Docker builds
# The actual Dockerfile should handle PyTorch CUDA installation
cuda-version = "12.1"
python-version = "3.11" 
